spring.application.name=cuando-llega-pro
spring.config.import=optional:classpath:secrets.properties
# Upstream Proxy Configuration (Opcional - la telemetría se delega a los clientes móviles)
app.proxy.enabled=false
app.proxy.mgp.minimum-interval-ms=6000
app.proxy.mgp.maximum-concurrent-requests=1
app.proxy.mgp.rate-limit-cooldown-ms=60000

# Static map catalogue published by us. This never calls the municipal API.
app.transit.source.url=https://raw.githubusercontent.com/gianmdp03/paradas_mgp/main/paradas_mgp.json
app.transit.source.poll-interval-ms=21600000
app.transit.source.initial-delay-ms=60000

# Server & Concurrency
server.port=8400
spring.threads.virtual.enabled=true
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json
server.compression.min-response-size=1024

# Database / HikariCP Connection Pool
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cuando_llega_pro}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=5000
# A full published-catalog UPSERT can legitimately hold its transaction for over 30 seconds.
spring.datasource.hikari.leak-detection-threshold=120000
spring.datasource.hikari.max-lifetime=1200000

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Downstream Go Proxy
app.proxy.base-url=${MGP_PROXY_URL:http://localhost:8079}
app.proxy.connect-timeout-seconds=5
app.proxy.read-timeout-seconds=50
app.proxy.origin=http://localhost:8400

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=-1

# Caffeine Cache
spring.cache.type=caffeine
spring.cache.cache-names=arrivals,lines
app.cache.transit-catalog.ttl-hours=24

# Logging Controls & Framework Noise Suppression
logging.level.root=INFO
logging.level.com.gianmdp03.cuando_llega_pro=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN

# Logback Rolling Policy Safeguards (in case file logging is activated)
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB
logging.logback.rollingpolicy.clean-history-on-start=true
