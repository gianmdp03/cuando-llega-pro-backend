services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:3.5.2
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      TZ: America/Argentina/Buenos_Aires
    shm_size: 256mb
    networks:
      - transit-net

  mgp-proxy:
    build:
      context: ../go-anti-cloudflare
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8079"
      UPSTREAM_URL: "https://appsl.mardelplata.gob.ar/app_cuando_llega/webWS.php"
      TIMEOUT_SECONDS: "45"
      ALLOWED_ORIGIN: "http://spring-boot:8400"
      TLS_PROFILE: "Firefox_120"
      LOG_LEVEL: "info"
      AUTH_SERVICE_URL: "http://flaresolverr:8191/v1"
    depends_on:
      flaresolverr:
        condition: service_started
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - transit-net

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - cuando-llega-pgdata:/var/lib/postgresql
    networks:
      - transit-net

  spring-boot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8400:8400"
    environment:
      SERVER_PORT: "8400"
      SPRING_THREADS_VIRTUAL_ENABLED: "true"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB}"
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
      MGP_PROXY_URL: "http://mgp-proxy:8079"
    depends_on:
      postgres:
        condition: service_healthy
      mgp-proxy:
        condition: service_healthy
    networks:
      - transit-net

networks:
  transit-net:
    driver: bridge

volumes:
  cuando-llega-pgdata: