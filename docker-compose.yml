services:
  # ============================================================================
  # Go TLS-Spoofing Sidecar Proxy Service
  # ============================================================================
  mgp-proxy:
    build:
      context: ../go-anti-cloudflare
      dockerfile: Dockerfile
    container_name: mgp-proxy
    restart: unless-stopped
    environment:
      PORT: "8079"
      UPSTREAM_URL: "https://appsl.mardelplata.gob.ar/app_cuando_llega/webWS.php"
      TIMEOUT_SECONDS: "45"
      ALLOWED_ORIGIN: "http://spring-boot:8400"
      TLS_PROFILE: "Firefox_120"
      LOG_LEVEL: "info"
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 64M
    networks:
      - transit-net

  # ============================================================================
  # Production PostgreSQL Database Service
  # ============================================================================
  postgres:
    image: postgres:18
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cuando_llega_pro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cuando_llega_pro"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - transit-net

  # ============================================================================
  # High-Concurrency Spring Boot Backend Application
  # ============================================================================
  spring-boot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cuando-llega-backend
    restart: unless-stopped
    env_file:
      - src/main/resources/secrets.properties
    ports:
      - "8400:8400"
    depends_on:
      postgres:
        condition: service_healthy
      mgp-proxy:
        condition: service_healthy
    environment:
      SERVER_PORT: 8400
      SPRING_THREADS_VIRTUAL_ENABLED: "true"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/cuando_llega_pro"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
      MGP_PROXY_URL: "http://mgp-proxy:8079"
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 1G
    networks:
      - transit-net

# ==============================================================================
# Isolated Internal Bridge Network
# ==============================================================================
networks:
  transit-net:
    driver: bridge
    name: mgp-transit-network

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  pgdata:
    driver: local
